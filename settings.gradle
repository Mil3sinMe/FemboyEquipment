pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'femboyequipment'

// An example addon showing how to extend FemboyEquipment (see ADDONS.md)
include 'example-addon'

// The 30 official addons (generated by tools/generators/official_addons.py), each its own mod
file('official-addons').listFiles().findAll { it.isDirectory() && it.name != 'testbed' && new File(it, 'build.gradle').exists() }
		.sort { it.name }.each { include ":official-addons:${it.name}" }
// Dev-only project that runs every official addon together: ./gradlew -PaddonTestbed :official-addons:testbed:runClient
if (providers.gradleProperty('addonTestbed').isPresent()) {
	include ':official-addons:testbed'
}
