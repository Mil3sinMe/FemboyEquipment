name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fabric Loom 1.19 needs Java 25 to run Gradle (the mod itself targets Java 21).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Find mod jar
        id: jar
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=build/libs/femboyequipment-$version.jar" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: femboyequipment-${{ steps.jar.outputs.version }}
          path: ${{ steps.jar.outputs.path }}

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.jar.outputs.version }}
          name: FemboyEquipment ${{ steps.jar.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ steps.jar.outputs.path }}
          body: |
            Minecraft 1.21.11 · Fabric Loader 0.18.4+ · needs Fabric API.
            Drop the jar into your `mods` folder together with Fabric API.
