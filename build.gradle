plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Loom adds the Minecraft and Fabric repositories automatically.
	// Trinkets (optional accessory slots) is pulled from Modrinth's maven.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	// Cardinal Components API: needed to compile against Trinkets (Trinkets bundles it for players).
	exclusiveContent {
		forRepository {
			maven {
				name = "Ladysnake"
				url = "https://maven.ladysnake.org/releases"
			}
		}
		filter {
			includeGroup "org.ladysnake.cardinal-components-api"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"femboyequipment" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Trinkets is optional: we compile against it, and it's only on the classpath in dev runs.
	// Players can use any Trinkets fork for 1.21.11 (Trinkets Canary, Trinkets Updated, ...).
	modCompileOnly "maven.modrinth:trinkets-canary:${project.trinkets_version}"
	modLocalRuntime "maven.modrinth:trinkets-canary:${project.trinkets_version}"
	modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
	modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
