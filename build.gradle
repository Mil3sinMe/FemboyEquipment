plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Loom adds the Minecraft and Fabric repositories automatically.
	// Trinkets (optional accessory slots) is pulled from Modrinth's maven.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	// Cardinal Components API: needed to compile against Trinkets (Trinkets bundles it for players).
	exclusiveContent {
		forRepository {
			maven {
				name = "Ladysnake"
				url = "https://maven.ladysnake.org/releases"
			}
		}
		filter {
			includeGroup "org.ladysnake.cardinal-components-api"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"femboyequipment" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Trinkets Canary (MIT) is bundled inside our jar (jar-in-jar), so players get accessory slots without
	// installing anything else. It carries Cardinal Components API (MIT) inside it the same way.
	// If someone also installs a Trinkets fork themselves, Fabric Loader just uses the newer one.
	modImplementation "maven.modrinth:trinkets-canary:${project.trinkets_version}"
	include "maven.modrinth:trinkets-canary:${project.trinkets_version}"
	// Dev runs don't unpack the CCA jars nested inside Trinkets, so put CCA on the classpath directly.
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

	// Since 1.16.0 the 30 official addons ship inside the main jar (jar-in-jar), so one download has everything.
	// Each one is still its own mod in official-addons/ (same item IDs as the standalone jars).
	rootProject.file('official-addons').listFiles()
			.findAll { it.isDirectory() && it.name != 'testbed' && new File(it, 'build.gradle').exists() }
			.sort { it.name }
			.each { include project(":official-addons:${it.name}") }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
